services:
  - type: web
    name: deep-research-assistant
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: TAVILY_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: 21m00Tcm4TlvDq8ikWAM
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: deep_research_db
      - key: JWT_SECRET
        generateValue: true
      - key: LANGCHAIN_TRACING_V2
        value: "true"
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGCHAIN_PROJECT
        value: deep-research-assistant
